<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title"><title id="title">問17 クリッピングの解説図</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3571ae"/></marker></defs><rect width="640" height="480" rx="16" fill="#f1f7fc"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="320" y="35" font-size="23" fill="#173d6c" text-anchor="middle">クリッピング</text><text x="160" y="90" font-size="22" fill="#173d6c" text-anchor="middle">元の図形</text><text x="480" y="90" font-size="22" fill="#173d6c" text-anchor="middle">表示範囲の内側だけ</text><rect x="55" y="135" width="210" height="180" fill="white" stroke="#3571ae" stroke-dasharray="7 5"/><rect x="375" y="135" width="210" height="180" fill="white" stroke="#3571ae" stroke-dasharray="7 5"/><defs><clipPath id="clip"><rect x="375" y="135" width="210" height="180"/></clipPath></defs><path d="M20,275 L160,105 L300,260" fill="none" stroke="#d48a33" stroke-width="9"/><path d="M340,275 L480,105 L620,260" clip-path="url(#clip)" fill="none" stroke="#d48a33" stroke-width="9"/><path d="M280,350 L360,350" fill="none" stroke="#3571ae" stroke-width="2.5" marker-end="url(#arr)"/><text x="320" y="415" font-size="20" fill="#173d6c" text-anchor="middle">縮小ではなく、枠からはみ出した部分を除去</text></g></svg>
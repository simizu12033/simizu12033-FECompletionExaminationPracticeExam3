<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title"><title id="title">問22 存在しない行を抽出するSQLの解説図</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3571ae"/></marker></defs><rect width="640" height="480" rx="16" fill="#f1f7fc"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="320" y="35" font-size="23" fill="#173d6c" text-anchor="middle">存在しない行を抽出するSQL</text><rect x="20" y="70" width="250" height="100" rx="12" fill="#ffffff" stroke="#3571ae" stroke-width="2"/><text x="145.0" y="126.0" font-size="19" fill="#173d6c" text-anchor="middle">車種表：1・2・3</text><rect x="370" y="70" width="250" height="100" rx="12" fill="#ffffff" stroke="#3571ae" stroke-width="2"/><text x="495.0" y="126.0" font-size="19" fill="#173d6c" text-anchor="middle">在庫表：2・3</text><path d="M145,175 L250,230" fill="none" stroke="#3571ae" stroke-width="2.5" marker-end="url(#arr)"/><path d="M495,175 L390,230" fill="none" stroke="#3571ae" stroke-width="2.5" marker-end="url(#arr)"/><rect x="90" y="240" width="460" height="88" rx="12" fill="#ffffff" stroke="#3571ae" stroke-width="2"/><text x="320.0" y="290.0" font-size="19" fill="#173d6c" text-anchor="middle">LEFT JOIN：1→NULL、2→2、3→3</text><path d="M320,332 L320,363" fill="none" stroke="#3571ae" stroke-width="2.5" marker-end="url(#arr)"/><rect x="90" y="370" width="460" height="80" rx="12" fill="#d5eee9" stroke="#3571ae" stroke-width="2"/><text x="320.0" y="416.0" font-size="19" fill="#173d6c" text-anchor="middle">在庫側 IS NULL → 車種1だけを抽出</text></g></svg>
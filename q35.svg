<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" role="img" aria-labelledby="title"><title id="title">問35 トップダウン結合テストの解説図</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3571ae"/></marker></defs><rect width="640" height="480" rx="16" fill="#f1f7fc"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="320" y="35" font-size="23" fill="#173d6c" text-anchor="middle">トップダウン結合テスト</text><rect x="190" y="75" width="260" height="85" rx="12" fill="#ffffff" stroke="#3571ae" stroke-width="2"/><text x="320.0" y="111.0" font-size="19" fill="#173d6c" text-anchor="middle">上位モジュール（テスト対象</text><text x="320.0" y="136.0" font-size="19" fill="#173d6c" text-anchor="middle">）</text><path d="M320,164 L155,225" fill="none" stroke="#3571ae" stroke-width="2.5" marker-end="url(#arr)"/><path d="M320,164 L485,225" fill="none" stroke="#3571ae" stroke-width="2.5" marker-end="url(#arr)"/><rect x="25" y="230" width="260" height="100" rx="12" fill="#ffffff" stroke="#3571ae" stroke-width="2"/><text x="155.0" y="286.0" font-size="19" fill="#173d6c" text-anchor="middle">完成した下位モジュール</text><rect x="355" y="230" width="260" height="100" rx="12" fill="#d5eee9" stroke="#3571ae" stroke-width="2"/><text x="485.0" y="273.5" font-size="19" fill="#173d6c" text-anchor="middle">未完成の下位を置換するスタ</text><text x="485.0" y="298.5" font-size="19" fill="#173d6c" text-anchor="middle">ブ</text><text x="320" y="403" font-size="21" fill="#173d6c" text-anchor="middle">スタブは呼び出され、仮の結果を返す</text></g></svg>
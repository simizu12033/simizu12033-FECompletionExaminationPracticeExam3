<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 393" role="img" aria-labelledby="title"><title id="title">問56 喫茶店の必要客数の解説図</title><defs><marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#3571ae"/></marker></defs><rect width="640" height="393" rx="16" fill="#f1f7fc"/><g font-family="Meiryo,Yu Gothic,sans-serif"><text x="320" y="35" font-size="23" fill="#173d6c" text-anchor="middle">喫茶店の必要客数</text><rect x="35" y="65" width="570" height="72" rx="12" fill="#fff" stroke="#3571ae" stroke-width="2"/><text x="320.0" y="107.0" font-size="19" fill="#173d6c" text-anchor="middle">1人の限界利益 = 500 − 100 = 400円</text><path d="M320,146 L320,169" fill="none" stroke="#3571ae" stroke-width="2.5" marker-end="url(#arr)"/><rect x="35" y="173" width="570" height="76" rx="12" fill="#fff" stroke="#3571ae" stroke-width="2"/><text x="320.0" y="204.5" font-size="19" fill="#173d6c" text-anchor="middle">月間客数 = (300,000 + 100,000) /</text><text x="320.0" y="229.5" font-size="19" fill="#173d6c" text-anchor="middle">400 = 1,000</text><path d="M320,258 L320,281" fill="none" stroke="#3571ae" stroke-width="2.5" marker-end="url(#arr)"/><rect x="35" y="285" width="570" height="72" rx="12" fill="#d5eee9" stroke="#3571ae" stroke-width="2"/><text x="320.0" y="327.0" font-size="19" fill="#173d6c" text-anchor="middle">1席1日 = 1,000 / 20 / 10 = 5人</text></g></svg>
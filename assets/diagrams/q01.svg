<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img"><title>コード → 10で割った余り → 格納位置</title><rect width="760" height="430" rx="16" fill="#f1f7fc"/><g font-family="Meiryo,sans-serif" fill="#173d6c"><text x="28" y="40" font-size="23">コード → 10で割った余り → 格納位置</text><rect x="22" y="65" width="125" height="52" rx="8" fill="white" stroke="#3571ae"/><text x="84.5" y="98" text-anchor="middle" font-size="18">ア：a / i</text><rect x="165" y="65" width="370" height="52" rx="8" fill="white" stroke="#3571ae"/><text x="350.0" y="98" text-anchor="middle" font-size="18">97 mod 10=7 / 105 mod 10=5</text><rect x="557" y="65" width="180" height="52" rx="8" fill="white" stroke="#3571ae"/><text x="647.0" y="98" text-anchor="middle" font-size="18">7 ≠ 5</text><text x="148" y="98">→</text><text x="537" y="98">→</text><rect x="22" y="135" width="125" height="52" rx="8" fill="white" stroke="#3571ae"/><text x="84.5" y="168" text-anchor="middle" font-size="18">イ：b / r</text><rect x="165" y="135" width="370" height="52" rx="8" fill="white" stroke="#3571ae"/><text x="350.0" y="168" text-anchor="middle" font-size="18">98 mod 10=8 / 114 mod 10=4</text><rect x="557" y="135" width="180" height="52" rx="8" fill="white" stroke="#3571ae"/><text x="647.0" y="168" text-anchor="middle" font-size="18">8 ≠ 4</text><text x="148" y="168">→</text><text x="537" y="168">→</text><rect x="22" y="205" width="125" height="52" rx="8" fill="white" stroke="#3571ae"/><text x="84.5" y="238" text-anchor="middle" font-size="18">ウ：c / l</text><rect x="165" y="205" width="370" height="52" rx="8" fill="white" stroke="#3571ae"/><text x="350.0" y="238" text-anchor="middle" font-size="18">99 mod 10=9 / 108 mod 10=8</text><rect x="557" y="205" width="180" height="52" rx="8" fill="white" stroke="#3571ae"/><text x="647.0" y="238" text-anchor="middle" font-size="18">9 ≠ 8</text><text x="148" y="238">→</text><text x="537" y="238">→</text><rect x="22" y="275" width="125" height="52" rx="8" fill="#d5f1df" stroke="#3571ae"/><text x="84.5" y="308" text-anchor="middle" font-size="18">エ：d / x</text><rect x="165" y="275" width="370" height="52" rx="8" fill="#d5f1df" stroke="#3571ae"/><text x="350.0" y="308" text-anchor="middle" font-size="18">100 mod 10=0 / 120 mod 10=0</text><rect x="557" y="275" width="180" height="52" rx="8" fill="#d5f1df" stroke="#3571ae"/><text x="647.0" y="308" text-anchor="middle" font-size="18">0 = 0：衝突</text><text x="148" y="308">→</text><text x="537" y="308">→</text><text x="28" y="388" font-size="17">異なる文字でも、同じ格納位置になれば衝突する。</text></g></svg>